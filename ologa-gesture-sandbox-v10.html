<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OLOGA — Sandbox de Gestos v10</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Courier New', monospace;
    background: #0a0a0a;
    color: #e0e0e0;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    height: 100%;
    width: 100%;
    position: fixed;
  }
  #app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    width: 100dvw;
    overflow: hidden;
  }
  #main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    overflow: hidden;
    min-width: 0;
  }
  #draw-container {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
    border: 1px solid #4ecdc4;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #gesture-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    cursor: crosshair;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    display: block;
  }
  #preview-container {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #0f0f0f;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mini-preview {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mini-preview img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
    border-radius: 4px;
  }
  #mini-preview .empty-preview {
    color: #333;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  #canvas-overlay {
    position: absolute;
    top: 12px;
    left: 12px;
    pointer-events: none;
    font-size: 10px;
    color: #4ecdc4;
    line-height: 1.5;
    z-index: 10;
    opacity: 0.7;
  }
  #gesture-status {
    position: absolute;
    top: 12px;
    right: 12px;
    pointer-events: none;
    font-size: 10px;
    color: #4ecdc4;
    text-align: right;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
    background: rgba(10,10,10,0.85);
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid #222;
  }
  #gesture-status.active { opacity: 1; }
  #gesture-status .timeout-bar {
    width: 80px;
    height: 2px;
    background: #222;
    margin-top: 4px;
    position: relative;
    border-radius: 1px;
  }
  #gesture-status .timeout-fill {
    height: 100%;
    background: #ff6b6b;
    width: 0%;
    transition: width 0.1s linear;
    border-radius: 1px;
  }
  #sidebar {
    width: 360px;
    min-width: 280px;
    max-width: 40vw;
    background: #141414;
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-overflow-scrolling: touch;
  }
  #sidebar h2 {
    padding: 10px 14px;
    font-size: 10px;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  #realtime-log {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 14px;
    font-size: 10px;
    line-height: 1.5;
    color: #aaa;
    -webkit-overflow-scrolling: touch;
    word-break: break-all;
  }
  #realtime-log .event-line {
    border-bottom: 1px solid #1a1a1a;
    padding: 2px 0;
  }
  #realtime-log .highlight { color: #ff6b6b; }
  #realtime-log .phase { color: #4ecdc4; }
  #realtime-log .stroke-divider {
    color: #666;
    border-bottom: 1px solid #333;
    padding: 2px 0;
    margin-top: 2px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #summary-area {
    border-top: 1px solid #222;
    padding: 10px 14px;
    max-height: 28vh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
  }
  #summary-area h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin-bottom: 6px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    font-size: 10px;
    border-bottom: 1px solid #1a1a1a;
    gap: 8px;
  }
  .stat-label { color: #666; flex-shrink: 0; }
  .stat-value { color: #e0e0e0; text-align: right; }
  .stat-value.alert { color: #ff6b6b; }
  .stat-value.ok { color: #4ecdc4; }
  #controls {
    display: flex;
    gap: 6px;
    padding: 8px 14px;
    border-top: 1px solid #222;
    flex-shrink: 0;
  }
  button {
    flex: 1;
    padding: 8px 6px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #aaa;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border-radius: 3px;
    white-space: nowrap;
  }
  button:hover, button:active {
    background: #222;
    border-color: #555;
    color: #fff;
  }
  button.primary {
    border-color: #4ecdc4;
    color: #4ecdc4;
  }
  button.primary:hover, button.primary:active {
    background: #4ecdc4;
    color: #0a0a0a;
  }
  #export-area {
    padding: 8px 14px;
    border-top: 1px solid #222;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  #export-area a, #export-area button.link {
    color: #4ecdc4;
    text-decoration: none;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty-state {
    color: #333;
    font-size: 10px;
    text-align: center;
    padding: 20px 14px;
  }

  /* Tablet */
  @media (max-width: 1024px) {
    #sidebar { width: 300px; min-width: 260px; }
  }

  /* Mobile landscape */
  @media (max-width: 768px) {
    #app { flex-direction: column; }
    #sidebar { 
      width: 100%; 
      max-width: 100%; 
      min-width: auto;
      height: 35vh; 
      border-left: none; 
      border-top: 1px solid #222; 
    }
    #main-area { 
      height: 65vh; 
      padding: 8px; 
      gap: 8px;
      flex-direction: row;
    }
    #draw-container, #preview-container {
      height: 100%;
      aspect-ratio: auto;
      flex: 1;
    }
    #canvas-overlay { font-size: 9px; top: 8px; left: 8px; }
    #gesture-status { font-size: 9px; top: 8px; right: 8px; padding: 6px 8px; }
    #sidebar h2 { padding: 6px 10px; font-size: 9px; }
    #realtime-log { padding: 6px 10px; font-size: 9px; }
    #summary-area { padding: 6px 10px; max-height: 22vh; }
    #controls { padding: 6px 10px; }
    button { font-size: 9px; padding: 6px 4px; }
    #export-area { padding: 6px 10px; }
    .stat-row { font-size: 9px; }
  }

  /* Mobile portrait */
  @media (max-width: 480px) {
    #main-area {
      flex-direction: column;
      height: 60vh;
    }
    #sidebar { height: 40vh; }
    #draw-container { flex: 1.2; }
    #preview-container { flex: 0.8; }
    #canvas-overlay { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="main-area">
    <div id="draw-container">
      <canvas id="gesture-canvas"></canvas>
      <div id="canvas-overlay">
        DIBUJÁ UN GESTO<br>
        <span style="color:#666">Toque = punto · Arrastre = línea</span>
      </div>
      <div id="gesture-status">
        <div id="status-text">TRAZO 1 · 0pts</div>
        <div class="timeout-bar"><div class="timeout-fill" id="timeout-fill"></div></div>
        <div style="font-size:9px; color:#666; margin-top:3px;">Esperando...</div>
      </div>
    </div>
    <div id="preview-container">
      <div id="mini-preview">
        <span class="empty-preview">Preview del gesto</span>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <h2>Narración en tiempo real</h2>
    <div id="realtime-log">
      <div class="empty-state">Esperando gesto...</div>
    </div>
    <div id="summary-area">
      <h3>Resumen del gesto</h3>
      <div id="summary-content">
        <div class="empty-state">El gesto finaliza tras 2s de inactividad</div>
      </div>
    </div>
    <div id="controls">
      <button id="btn-clear">Borrar</button>
      <button id="btn-finish" class="primary">Finalizar</button>
    </div>
    <div id="export-area"></div>
  </div>
</div>

<canvas id="gesture-path" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gesture-canvas');
const ctx = canvas.getContext('2d');
const pathCanvas = document.getElementById('gesture-path');
const pathCtx = pathCanvas.getContext('2d');
const logEl = document.getElementById('realtime-log');
const summaryEl = document.getElementById('summary-content');
const exportArea = document.getElementById('export-area');
const miniPreview = document.getElementById('mini-preview');
const statusEl = document.getElementById('gesture-status');
const statusText = document.getElementById('status-text');
const timeoutFill = document.getElementById('timeout-fill');

const FINISH_TIMEOUT = 2000;
const TAP_THRESHOLD_PX = 8;      // máxima distancia para considerar "toque"
const TAP_THRESHOLD_MS = 300;    // máxima duración para considerar "toque"

let isDrawing = false;
let points = [];
let strokes = [];
let currentStrokeIdx = -1;
let logLines = [];
let lastLogTime = 0;
let finishTimer = null;
let gestureActive = false;
let gestureStartTime = 0;
let analysisData = null;
let activePointerId = null;
let lastDrawnPoint = null;
let tapStartPos = null;          // para detectar toques
let tapStartTime = 0;
let hasMoved = false;            // flag: ¿se movió desde el down?

function getCanvasRect() {
  return canvas.getBoundingClientRect();
}

function resizeCanvas() {
  const rect = getCanvasRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(resizeCanvas, 150);
});

window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 300);
});

resizeCanvas();
requestAnimationFrame(resizeCanvas);

function clearAll() {
  points = [];
  strokes = [];
  currentStrokeIdx = -1;
  logLines = [];
  analysisData = null;
  activePointerId = null;
  lastDrawnPoint = null;
  tapStartPos = null;
  hasMoved = false;
  if (finishTimer) clearTimeout(finishTimer);
  finishTimer = null;
  gestureActive = false;
  isDrawing = false;

  const rect = getCanvasRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  logEl.innerHTML = '<div class="empty-state">Esperando gesto...</div>';
  summaryEl.innerHTML = '<div class="empty-state">El gesto finaliza tras 2s de inactividad</div>';
  exportArea.innerHTML = '';
  miniPreview.innerHTML = '<span class="empty-preview">Preview del gesto</span>';
  statusEl.classList.remove('active');
  statusText.textContent = '';
  timeoutFill.style.width = '0%';
}

function getPointerPos(e) {
  const rect = getCanvasRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
    t: performance.now()
  };
}

function isInsideCanvas(x, y) {
  const rect = getCanvasRect();
  return x >= 0 && x <= rect.width && y >= 0 && y <= rect.height;
}

function dist(a, b) {
  return Math.sqrt((a.x - b.x)**2 + (a.y - b.y)**2);
}

function angle(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

function addLog(text, type = '') {
  const now = performance.now();
  if (now - lastLogTime < 30 && type !== 'highlight' && type !== 'phase' && type !== 'stroke-divider') return;
  lastLogTime = now;

  if (logLines.length === 0 && logEl.querySelector('.empty-state')) {
    logEl.innerHTML = '';
  }

  const div = document.createElement('div');
  div.className = 'event-line' + (type ? ' ' + type : '');
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  logLines.push(text);
  if (logLines.length > 300) {
    logEl.removeChild(logEl.firstChild);
    logLines.shift();
  }
}

function updateStatus() {
  if (!gestureActive) {
    statusEl.classList.remove('active');
    return;
  }
  statusEl.classList.add('active');
  const totalPoints = points.length;
  const strokeCount = strokes.length;
  const elapsed = points.length > 0 ? (points[points.length-1].t - gestureStartTime).toFixed(0) : '0';
  statusText.textContent = `TRAZO ${strokeCount} · ${totalPoints}pts · ${elapsed}ms`;
}

function startFinishTimer() {
  if (finishTimer) clearTimeout(finishTimer);

  let remaining = FINISH_TIMEOUT;
  const start = performance.now();

  function tick() {
    if (!gestureActive || isDrawing) return;
    const elapsed = performance.now() - start;
    remaining = FINISH_TIMEOUT - elapsed;

    if (remaining <= 0) {
      timeoutFill.style.width = '100%';
      finishGesture();
      return;
    }

    timeoutFill.style.width = `${((FINISH_TIMEOUT - remaining) / FINISH_TIMEOUT) * 100}%`;
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  finishTimer = setTimeout(() => {
    if (!isDrawing && gestureActive) finishGesture();
  }, FINISH_TIMEOUT);
}

function cancelFinishTimer() {
  if (finishTimer) {
    clearTimeout(finishTimer);
    finishTimer = null;
  }
  timeoutFill.style.width = '0%';
}

function finishGesture() {
  if (!gestureActive) return;
  gestureActive = false;
  isDrawing = false;
  activePointerId = null;
  lastDrawnPoint = null;
  tapStartPos = null;
  hasMoved = false;
  if (finishTimer) clearTimeout(finishTimer);
  finishTimer = null;
  timeoutFill.style.width = '0%';
  statusEl.classList.remove('active');

  addLog(`─── GESTO FINALIZADO ───`, 'phase');
  if (points.length > 0) {
    addLog(`${strokes.length} trazo(s) · ${points.length} puntos · ${((points[points.length-1].t - points[0].t)/1000).toFixed(2)}s`, 'highlight');
  }

  analyzeGesture();
}

// ========== ANÁLISIS GEOMÉTRICO ==========

function segmentsIntersect(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 0.001) return null;
  const ua = ((p4.x - p3.x) * (p1.y - p3.y) - (p4.y - p3.y) * (p1.x - p3.x)) / d;
  const ub = ((p2.x - p1.x) * (p1.y - p3.y) - (p2.y - p1.y) * (p1.x - p3.x)) / d;
  if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
    return {
      x: p1.x + ua * (p2.x - p1.x),
      y: p1.y + ua * (p2.y - p1.y),
      t: (p1.t + p2.t) / 2
    };
  }
  return null;
}

function findIntersections(pts) {
  const intersections = [];
  if (pts.length < 10) return intersections;
  for (let i = 0; i < pts.length - 11; i++) {
    for (let j = i + 10; j < pts.length - 1; j++) {
      const inter = segmentsIntersect(pts[i], pts[i+1], pts[j], pts[j+1]);
      if (inter) {
        const tooClose = intersections.some(ix => dist(ix, inter) < 15);
        if (!tooClose) intersections.push(inter);
      }
    }
  }
  return intersections;
}

function findLoops(pts) {
  const loops = [];
  if (pts.length < 20) return loops;
  for (let i = 0; i < pts.length - 20; i++) {
    for (let j = i + 15; j < Math.min(i + 300, pts.length); j++) {
      if (dist(pts[i], pts[j]) < 25) {
        const loopPts = pts.slice(i, j);
        const perimeter = loopPts.reduce((sum, p, idx) => {
          if (idx === 0) return 0;
          return sum + dist(loopPts[idx-1], p);
        }, 0);
        const area = Math.abs(loopPts.reduce((sum, p, idx) => {
          if (idx === 0) return 0;
          return sum + (loopPts[idx-1].x * p.y - p.x * loopPts[idx-1].y);
        }, 0)) / 2;
        if (perimeter > 50 && area > 300) {
          loops.push({ start: i, end: j, center: pts[i], perimeter, area });
          break;
        }
      }
    }
  }
  return loops.filter((l, i, arr) => {
    return !arr.slice(0, i).some(prev => Math.abs(prev.start - l.start) < 30);
  });
}

function analyzePhases(pts) {
  if (pts.length < 5) return [];
  const phases = [];
  let current = { start: 0, type: 'inicio', speeds: [], curvatures: [] };

  for (let i = 1; i < pts.length - 1; i++) {
    const dt = Math.max(0.001, (pts[i].t - pts[i-1].t));
    const v = dist(pts[i], pts[i-1]) / dt;
    const a1 = angle(pts[i-1], pts[i]);
    const a2 = angle(pts[i], pts[i+1]);
    let curvature = Math.abs(a2 - a1);
    if (curvature > 180) curvature = 360 - curvature;

    current.speeds.push(v);
    current.curvatures.push(curvature);

    if (current.speeds.length > 12) {
      const avgSpeed = current.speeds.reduce((a,b)=>a+b,0) / current.speeds.length;
      const avgCurve = current.curvatures.reduce((a,b)=>a+b,0) / current.curvatures.length;

      let type = 'curva';
      if (avgCurve < 12) type = 'linea';
      else if (avgCurve > 50 && avgSpeed > 2) type = 'rulo';
      else if (avgSpeed < 0.5) type = 'pausa';
      else if (avgSpeed > 6) type = 'rapido';

      if (type !== current.type && current.speeds.length > 8) {
        phases.push({...current, end: i, avgSpeed, avgCurve});
        current = { start: i, type, speeds: [v], curvatures: [curvature] };
      }
    }
  }
  phases.push({...current, end: pts.length - 1});
  return phases.map((p, i) => ({
    ...p,
    label: `FASE ${i+1}: ${p.type.toUpperCase()}`,
    duration: ((pts[p.end].t - pts[p.start].t) / 1000).toFixed(2),
    relStart: (p.start / pts.length).toFixed(2),
    relEnd: (p.end / pts.length).toFixed(2),
    pointCount: p.end - p.start
  }));
}

function analyzeStrokeMetadata(strokesArr) {
  return strokesArr.map((stroke, i) => {
    if (stroke.length < 1) return null;
    // Un punto aislado (1 solo punto) tiene length=0, duration=0
    const len = stroke.length < 2 ? 0 : stroke.reduce((sum, p, idx) => idx === 0 ? 0 : sum + dist(stroke[idx-1], p), 0);
    const duration = stroke.length < 2 ? 0 : (stroke[stroke.length-1].t - stroke[0].t) / 1000;
    const straightDist = stroke.length < 2 ? 0 : dist(stroke[0], stroke[stroke.length-1]);
    const rectitude = stroke.length < 2 ? 0 : straightDist / Math.max(len, 1);
    return {
      strokeIndex: i + 1,
      pointCount: stroke.length,
      length: Math.round(len),
      duration: parseFloat(duration.toFixed(3)),
      rectitude: parseFloat(rectitude.toFixed(3)),
      startPos: { x: Math.round(stroke[0].x), y: Math.round(stroke[0].y) },
      endPos: stroke.length > 1 
        ? { x: Math.round(stroke[stroke.length-1].x), y: Math.round(stroke[stroke.length-1].y) }
        : { x: Math.round(stroke[0].x), y: Math.round(stroke[0].y) },
      isDot: stroke.length === 1 || (len < TAP_THRESHOLD_PX && duration < TAP_THRESHOLD_MS / 1000)
    };
  }).filter(Boolean);
}

function analyzeGesture() {
  if (points.length < 1) return;

  const totalTime = points.length > 1 ? (points[points.length-1].t - points[0].t) / 1000 : 0;
  const totalLength = points.reduce((sum, p, i) => i === 0 ? 0 : sum + dist(points[i-1], p), 0);
  const straightDist = points.length > 1 ? dist(points[0], points[points.length-1]) : 0;
  const straightness = points.length > 1 ? straightDist / Math.max(totalLength, 1) : 0;

  const bbox = {
    minX: Math.min(...points.map(p => p.x)),
    maxX: Math.max(...points.map(p => p.x)),
    minY: Math.min(...points.map(p => p.y)),
    maxY: Math.max(...points.map(p => p.y))
  };
  const width = bbox.maxX - bbox.minX;
  const height = bbox.maxY - bbox.minY;
  const area = width * height;
  const density = totalLength / Math.max(area, 1);

  const intersections = findIntersections(points);
  const loops = findLoops(points);
  const phases = analyzePhases(points);
  const strokeMeta = analyzeStrokeMetadata(strokes);

  const speeds = points.slice(1).map((p, i) => {
    const dt = Math.max(0.001, (p.t - points[i].t) / 1000);
    return dist(p, points[i]) / dt;
  });
  const avgSpeed = speeds.length > 0 ? speeds.reduce((a,b) => a+b, 0) / speeds.length : 0;
  const maxSpeed = speeds.length > 0 ? Math.max(...speeds, 0) : 0;
  const minSpeed = speeds.length > 0 ? Math.min(...speeds, Infinity) : 0;

  const angles = points.slice(1).map((p, i) => angle(points[i], p));
  const angleChanges = angles.slice(1).map((a, i) => {
    let diff = Math.abs(a - angles[i]);
    return diff > 180 ? 360 - diff : diff;
  });
  const avgAngleChange = angleChanges.length > 0 ? angleChanges.reduce((a,b) => a+b, 0) / angleChanges.length : 0;
  const sharpTurns = angleChanges.filter(a => a > 45).length;
  const smoothCurves = angleChanges.filter(a => a > 15 && a <= 45).length;

  const centroidX = points.reduce((s,p) => s+p.x, 0) / points.length;
  const centroidY = points.reduce((s,p) => s+p.y, 0) / points.length;

  const quadrants = [0,0,0,0];
  points.forEach(p => {
    const qx = p.x < centroidX ? 0 : 1;
    const qy = p.y < centroidY ? 0 : 1;
    quadrants[qx + qy*2]++;
  });
  const total = points.length;
  const entropy = -quadrants.reduce((sum, q) => {
    const p = q / total;
    return p > 0 ? sum + p * Math.log2(p) : sum;
  }, 0);

  // Dibujar en canvas de path para exportar
  const padding = 40;
  pathCanvas.width = Math.max(400, width + padding * 2);
  pathCanvas.height = Math.max(300, height + padding * 2);
  pathCtx.clearRect(0, 0, pathCanvas.width, pathCanvas.height);

  const offsetX = padding - bbox.minX;
  const offsetY = padding - bbox.minY;

  const colors = ['#ffffff', '#cccccc', '#aaaaaa', '#888888'];
  strokes.forEach((stroke, si) => {
    if (stroke.length === 1) {
      // Dibujar punto como círculo pequeño
      pathCtx.fillStyle = colors[si % colors.length];
      pathCtx.beginPath();
      pathCtx.arc(stroke[0].x + offsetX, stroke[0].y + offsetY, 6, 0, Math.PI * 2);
      pathCtx.fill();
    } else {
      pathCtx.strokeStyle = colors[si % colors.length];
      pathCtx.lineWidth = 4;
      pathCtx.lineCap = 'round';
      pathCtx.lineJoin = 'round';
      pathCtx.beginPath();
      stroke.forEach((p, i) => {
        if (i === 0) pathCtx.moveTo(p.x + offsetX, p.y + offsetY);
        else pathCtx.lineTo(p.x + offsetX, p.y + offsetY);
      });
      pathCtx.stroke();
    }
  });

  pathCtx.fillStyle = '#ff6b6b';
  intersections.forEach(ix => {
    pathCtx.beginPath();
    pathCtx.arc(ix.x + offsetX, ix.y + offsetY, 7, 0, Math.PI * 2);
    pathCtx.fill();
  });

  pathCtx.strokeStyle = '#4ecdc4';
  pathCtx.lineWidth = 3;
  loops.forEach(loop => {
    const lp = points.slice(loop.start, loop.end);
    pathCtx.beginPath();
    lp.forEach((p, i) => {
      if (i === 0) pathCtx.moveTo(p.x + offsetX, p.y + offsetY);
      else pathCtx.lineTo(p.x + offsetX, p.y + offsetY);
    });
    pathCtx.stroke();
  });

  const pngUrl = pathCanvas.toDataURL('image/png');

  analysisData = {
    timestamp: new Date().toISOString(),
    gesture: {
      totalStrokes: strokes.length,
      totalPoints: points.length,
      totalDuration: parseFloat(totalTime.toFixed(3)),
      totalLength: Math.round(totalLength),
      straightness: parseFloat(straightness.toFixed(3)),
      avgSpeed: parseFloat(avgSpeed.toFixed(2)),
      maxSpeed: parseFloat(maxSpeed.toFixed(2)),
      minSpeed: parseFloat(minSpeed.toFixed(2)),
      avgAngleChange: parseFloat(avgAngleChange.toFixed(1)),
      sharpTurns,
      smoothCurves,
      intersections: intersections.length,
      loops: loops.length,
      bbox: {
        width: Math.round(width),
        height: Math.round(height),
        area: Math.round(area),
        density: parseFloat(density.toFixed(4))
      },
      entropy: parseFloat(entropy.toFixed(2)),
      aspectRatio: parseFloat((width/Math.max(height,1)).toFixed(2)),
      centroid: { x: Math.round(centroidX), y: Math.round(centroidY) },
      startPos: { x: Math.round(points[0].x), y: Math.round(points[0].y) },
      endPos: points.length > 1 
        ? { x: Math.round(points[points.length-1].x), y: Math.round(points[points.length-1].y) }
        : { x: Math.round(points[0].x), y: Math.round(points[0].y) }
    },
    strokes: strokeMeta,
    phases: phases,
    intersections: intersections.map(ix => ({ x: Math.round(ix.x), y: Math.round(ix.y), t: Math.round(ix.t) })),
    loops: loops.map(l => ({ startIdx: l.start, endIdx: l.end, area: Math.round(l.area), perimeter: Math.round(l.perimeter) })),
    rawNarrative: logLines
  };

  let html = '';
  html += `<div class="stat-row"><span class="stat-label">Trazos compuestos</span><span class="stat-value ${strokes.length > 1 ? 'ok' : ''}">${strokes.length}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Puntos totales</span><span class="stat-value">${points.length}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Duración total</span><span class="stat-value">${totalTime.toFixed(2)}s</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Longitud total</span><span class="stat-value">${Math.round(totalLength)}px</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Rectitud global</span><span class="stat-value ${straightness > 0.9 ? 'ok' : ''}">${straightness.toFixed(3)}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Velocidad promedio</span><span class="stat-value">${avgSpeed.toFixed(1)} px/s</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Velocidad máxima</span><span class="stat-value">${maxSpeed.toFixed(1)} px/s</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Cambio ángulo promedio</span><span class="stat-value">${avgAngleChange.toFixed(1)}°</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Giros bruscos (>45°)</span><span class="stat-value ${sharpTurns > 0 ? 'alert' : ''}">${sharpTurns}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Curvas suaves (15-45°)</span><span class="stat-value ${smoothCurves > 0 ? 'ok' : ''}">${smoothCurves}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Intersecciones</span><span class="stat-value ${intersections.length > 0 ? 'alert' : ''}">${intersections.length}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Bucles cerrados</span><span class="stat-value ${loops.length > 0 ? 'ok' : ''}">${loops.length}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Área bounding box</span><span class="stat-value">${Math.round(area)}px²</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Densidad</span><span class="stat-value">${density.toFixed(4)}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Entropía espacial</span><span class="stat-value">${entropy.toFixed(2)}</span></div>`;
  html += `<div class="stat-row"><span class="stat-label">Relación ancho/alto</span><span class="stat-value">${(width/Math.max(height,1)).toFixed(2)}</span></div>`;

  if (strokeMeta.length > 0) {
    html += `<div style="margin-top:8px; border-top:1px solid #222; padding-top:4px;"><h3 style="font-size:9px; color:#666; margin-bottom:4px;">Trazos individuales</h3>`;
    strokeMeta.forEach(s => {
      html += `<div class="stat-row"><span class="stat-label">Trazo ${s.strokeIndex}${s.isDot ? ' (PUNTO)' : ''}</span><span class="stat-value">${s.length}px · ${s.duration}s · rect=${s.rectitude}</span></div>`;
    });
    html += `</div>`;
  }

  if (phases.length > 0) {
    html += `<div style="margin-top:8px; border-top:1px solid #222; padding-top:4px;"><h3 style="font-size:9px; color:#666; margin-bottom:4px;">Fases detectadas</h3>`;
    phases.forEach(p => {
      html += `<div class="stat-row"><span class="stat-label">${p.label}</span><span class="stat-value">${p.duration}s (${p.relStart}-${p.relEnd}) · ${p.pointCount}pts</span></div>`;
    });
    html += `</div>`;
  }

  summaryEl.innerHTML = html;
  miniPreview.innerHTML = `<img src="${pngUrl}" alt="gesto">`;

  exportArea.innerHTML = `
    <a href="${pngUrl}" download="ologa-gesto-${Date.now()}.png">↓ Descargar PNG</a>
    <button class="link" id="btn-export-json">↓ Descargar JSON</button>
    <button class="link" id="btn-export-txt">↓ Descargar TXT</button>
  `;

  document.getElementById('btn-export-json').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(analysisData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ologa-gesto-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-export-txt').addEventListener('click', () => {
    let txt = `OLOGA — NARRACIÓN DEL GESTO
`;
    txt += `Generado: ${analysisData.timestamp}
`;
    txt += `========================================

`;
    txt += `RESUMEN NUMÉRICO:
`;
    txt += `- Trazos compuestos: ${analysisData.gesture.totalStrokes}
`;
    txt += `- Puntos totales: ${analysisData.gesture.totalPoints}
`;
    txt += `- Duración: ${analysisData.gesture.totalDuration}s
`;
    txt += `- Longitud: ${analysisData.gesture.totalLength}px
`;
    txt += `- Rectitud: ${analysisData.gesture.straightness}
`;
    txt += `- Intersecciones: ${analysisData.gesture.intersections}
`;
    txt += `- Bucles: ${analysisData.gesture.loops}

`;
    txt += `TRAZOS INDIVIDUALES:
`;
    analysisData.strokes.forEach(s => {
      txt += `  [${s.strokeIndex}] ${s.isDot ? 'PUNTO' : 'TRAZO'}: ${s.length}px, ${s.duration}s, rect=${s.rectitude}
`;
      txt += `       inicio: (${s.startPos.x},${s.startPos.y}) → fin: (${s.endPos.x},${s.endPos.y})
`;
    });
    txt += `
FASES:
`;
    analysisData.phases.forEach(p => {
      txt += `  ${p.label}: ${p.duration}s (${p.relStart}-${p.relEnd})
`;
    });
    txt += `
NARRACIÓN EN TIEMPO REAL:
`;
    analysisData.rawNarrative.forEach(line => {
      txt += `  ${line}
`;
    });

    const blob = new Blob([txt], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ologa-gesto-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

// ========== EVENTOS DE DIBUJO ==========

function onPointerDown(e) {
  e.preventDefault();
  e.stopPropagation();

  if (isDrawing && activePointerId !== null && activePointerId !== e.pointerId) return;

  const pos = getPointerPos(e);
  if (!isInsideCanvas(pos.x, pos.y)) return;

  cancelFinishTimer();

  if (!gestureActive) {
    gestureActive = true;
    gestureStartTime = performance.now();
    points = [];
    strokes = [];
    logLines = [];
    logEl.innerHTML = '';
    const rect = getCanvasRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    addLog(`=== NUEVO GESTO ===`, 'phase');
  }

  isDrawing = true;
  activePointerId = e.pointerId;
  hasMoved = false;
  tapStartPos = pos;
  tapStartTime = pos.t;

  strokes.push([pos]);
  currentStrokeIdx = strokes.length - 1;
  points.push(pos);
  lastDrawnPoint = pos;

  addLog(`POINTER DOWN #${strokes.length}: (${Math.round(pos.x)}, ${Math.round(pos.y)})`, 'stroke-divider');
  updateStatus();
}

function onPointerMove(e) {
  if (!isDrawing || e.pointerId !== activePointerId) return;
  e.preventDefault();
  e.stopPropagation();

  const pos = getPointerPos(e);

  if (!isInsideCanvas(pos.x, pos.y)) {
    onPointerUp(e);
    return;
  }

  const last = lastDrawnPoint || points[points.length - 1];
  const d = dist(last, pos);

  if (d < 2) return;

  // Marcar que sí hubo movimiento significativo
  if (dist(tapStartPos, pos) > TAP_THRESHOLD_PX) {
    hasMoved = true;
  }

  points.push(pos);
  strokes[currentStrokeIdx].push(pos);

  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();

  lastDrawnPoint = pos;

  const dt = (pos.t - last.t) / 1000;
  const speed = d / Math.max(dt, 0.001);
  const dir = angle(last, pos);

  const stroke = strokes[currentStrokeIdx];
  if (stroke.length > 2) {
    const prev = stroke[stroke.length - 3];
    const a1 = angle(prev, last);
    const a2 = angle(last, pos);
    let curve = Math.abs(a2 - a1);
    if (curve > 180) curve = 360 - curve;

    let note = '';
    if (curve > 60) note = 'CURVA FUERTE';
    else if (curve > 20) note = 'curva suave';
    else note = 'recto';

    if (speed > 8) note += ' | RÁPIDO';
    else if (speed < 1) note += ' | lento';

    addLog(`t=${(pos.t - gestureStartTime).toFixed(0)}ms | v=${speed.toFixed(1)} | θ=${dir.toFixed(0)}° | curv=${curve.toFixed(0)}° | ${note}`);
  }

  updateStatus();
}

function onPointerUp(e) {
  if (!isDrawing || e.pointerId !== activePointerId) return;
  e.preventDefault();
  e.stopPropagation();

  const pos = getPointerPos(e);
  const tapDuration = pos.t - tapStartTime;
  const tapDistance = dist(tapStartPos, pos);

  // Si NO se movió significativamente → es un TOQUE / PUNTO
  if (!hasMoved && tapDistance < TAP_THRESHOLD_PX && tapDuration < TAP_THRESHOLD_MS) {
    // Dibujar un punto visual en el canvas
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath();
    ctx.arc(tapStartPos.x, tapStartPos.y, 4, 0, Math.PI * 2);
    ctx.fill();

    addLog(`TOQUE #${strokes.length}: (${Math.round(tapStartPos.x)}, ${Math.round(tapStartPos.y)}) · ${tapDuration.toFixed(0)}ms`, 'highlight');
  }

  isDrawing = false;
  activePointerId = null;
  lastDrawnPoint = null;
  tapStartPos = null;
  hasMoved = false;

  const stroke = strokes[currentStrokeIdx];
  if (stroke && stroke.length > 1) {
    addLog(`POINTER UP #${strokes.length}: ${stroke.length} puntos`, 'stroke-divider');
  }
  addLog(`Esperando siguiente trazo... (2s)`, 'phase');

  updateStatus();
  startFinishTimer();
}

function onPointerCancel(e) {
  if (e.pointerId !== activePointerId) return;

  isDrawing = false;
  activePointerId = null;
  lastDrawnPoint = null;
  tapStartPos = null;
  hasMoved = false;

  addLog(`POINTER CANCEL #${strokes.length}`, 'highlight');
  updateStatus();
  startFinishTimer();
}

function onPointerLeave(e) {
  if (isDrawing && e.pointerId === activePointerId) {
    addLog(`POINTER LEAVE: trazo cortado por límite`, 'highlight');
    onPointerUp(e);
  }
}

const eventOpts = { passive: false, capture: false };
canvas.addEventListener('pointerdown', onPointerDown, eventOpts);
canvas.addEventListener('pointermove', onPointerMove, eventOpts);
canvas.addEventListener('pointerup', onPointerUp, eventOpts);
canvas.addEventListener('pointercancel', onPointerCancel, eventOpts);
canvas.addEventListener('pointerleave', onPointerLeave, eventOpts);

const touchOpts = { passive: false };
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); }, touchOpts);
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); e.stopPropagation(); }, touchOpts);
canvas.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); }, touchOpts);

document.getElementById('btn-clear').addEventListener('click', clearAll);
document.getElementById('btn-finish').addEventListener('click', () => {
  if (gestureActive) {
    addLog(`Finalizado manualmente`, 'highlight');
    finishGesture();
  }
});

document.addEventListener('touchmove', (e) => {
  if (gestureActive) e.preventDefault();
}, { passive: false });

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());
document.addEventListener('gestureend', (e) => e.preventDefault());

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
